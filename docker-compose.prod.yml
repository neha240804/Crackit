# Crackit production stack: one VM, five containers.
#
#   web (Caddy)  :80/:443 ── HTTPS, static React app, proxies /api ──► backend :8001
#   backend      FastAPI + LangGraph + Kokoro voice (ONE process; see docker-entrypoint.sh)
#   postgres     users, interviews, prep data, LangGraph checkpoints   (no public port)
#   qdrant       question bank + resume vectors                         (no public port)
#   backup       nightly pg_dump into ./backups, keeps the newest 7
#
# Start / update (from the repo root on the server):
#   docker compose -f docker-compose.prod.yml up -d --build
# All settings come from .env (see .env.example, "Production" section). The development
# stack (docker-compose.yml) is separate and can run beside this one on a laptop.

name: crackit

# Docker keeps container logs forever by default; cap them so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mockinterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mockinterview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.20.1   # same version as development; pinned so an update is a choice
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # Inside the compose network the services are reached by name, whatever .env says
      # for local development.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
    volumes:
      # uploads/, exports/ and models/ (Kokoro files you copy in; FastEmbed downloads itself).
      - ./data:/srv/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    logging: *logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain, or :80 for a local test)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data       # HTTPS certificates: keep them across restarts
      - caddy_config:/config
    depends_on:
      - backend
    logging: *logging

  backup:
    image: postgres:16-alpine   # same pg_dump version as the server
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-mockinterview}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mockinterview}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  qdrant_data:
  caddy_data:
  caddy_config:
