# Continuous integration: every push and pull request runs the same checks as CLAUDE.md
# "Testing", plus a build of both production images, so a broken Dockerfile is caught
# before it reaches the server. Tests need no database, network or API keys.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Install (exactly uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests evals
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint

  images:
    # Only build (no push): proves both Dockerfiles still work. The server builds its own
    # arm64 images from the same files.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f backend/Dockerfile -t crackit-backend:ci .
      - name: Web image
        run: docker build -f frontend/Dockerfile -t crackit-web:ci .
      - name: Caddy config is valid
        run: docker run --rm -e SITE_ADDRESS=:80 crackit-web:ci caddy validate --config /etc/caddy/Caddyfile
