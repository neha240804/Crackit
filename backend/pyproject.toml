[project]
name = "mockinterview-backend"
version = "0.1.0"
description = "Crackit - interview practice: voice mock interviews, question prep, ATS check (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.11",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.22",
    "langchain-groq>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "fastembed>=0.9.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.14.3",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "kokoro-onnx>=0.6.1",
    "cryptography>=45",
    "sentry-sdk>=2.75.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "deepeval>=4.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
